<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekly Plan</title>
<meta name="theme-color" content="#a9cdd2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="banner" id="bannerTxt">WEEKLY PLAN</div>
    <div class="pill"><b>WEEK START</b><span id="wkStart"></span></div>
    <div class="pill" style="background:#f7cfc9"><b>WEEK END</b><span id="wkEnd"></span></div>
    <div class="mini">
      <div class="mini-head">
        <button class="iconbtn" id="mPrev">‹</button>
        <select id="mSel"></select><select id="ySel" style="flex:.7"></select>
        <button class="iconbtn" id="mNext">›</button>
      </div>
      <div class="cal" id="cal"></div>
    </div>
    <h4>Week progress</h4>
    <div class="barrow"><div class="bar"><i id="wkBar" style="width:0"></i></div><b id="wkPct">–</b></div>
    <h4 id="todoTitle">Weekly to-do list</h4>
    <div class="todo" id="todo"></div>
    <div class="barrow" style="margin-top:10px"><div class="bar"><i id="tdBar" style="width:0;background:#f5c9a0"></i></div><b id="tdPct">–</b></div>
    <p class="dim" style="margin-top:22px">Coming later: habits &amp; meal planner as extra tabs.</p>
  </aside>
  <main>
    <div class="topbar" id="topbar">
      <button class="iconbtn menu" id="menuBtn">☰</button>
      <button class="iconbtn" id="prev" title="Previous week">‹</button>
      <button class="iconbtn" id="today">Today</button>
      <button class="iconbtn" id="next" title="Next week">›</button>
      <h2 id="title"></h2>
      <button class="iconbtn" id="cust">✨ Customize</button>
    </div>
    <div class="board" id="board"></div>
  </main>
</div>

<dialog id="dlg">
  <h3 style="margin-top:0">✨ Make it yours</h3>
  <b>Theme</b><div class="themes" id="themes"></div>
  <b>Days</b><div id="dayRows"></div>
  <b style="display:block;margin-top:12px">Names &amp; week</b>
  <div class="f"><label>Week starts</label><select id="wsSel"></select></div>
  <div class="f"><label>Title</label><input id="lblBanner"></div>
  <div class="f"><label>“Focus” label</label><input id="lblFocus"></div>
  <div class="f"><label>Events label</label><input id="lblEvents"></div>
  <div class="f"><label>Tasks label</label><input id="lblTasks"></div>
  <div style="text-align:right;margin-top:14px"><button class="iconbtn" onclick="document.getElementById('dlg').close()">Done</button></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
